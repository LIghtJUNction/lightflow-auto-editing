[package]
name = "lightflow-xry-batch-produce"
version = "0.1.0"
edition = "2024"
description = "LightFlow boundary for the canonical XRY batch production pipeline."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lightjunction/lightflow-auto-editing"
keywords = ["lightflow", "workflow", "video", "xry"]
categories = ["multimedia::video", "development-tools"]

[[bin]]
name = "lightflow-xry-batch-produce-runner"
path = "src/bin/runner.rs"

[dependencies]
lightflow = { workspace = true }
lightflow-xry-gateway = { path = "../../xry_gateway" }
