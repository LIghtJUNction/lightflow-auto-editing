[package]
name = "lightflow-video-render-edit"
version = "0.1.0"
edition = "2024"
description = "LightFlow workflow contract for rendering automated video edit plans."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lightjunction/lightflow-auto-editing"
keywords = ["lightflow", "workflow", "video", "ffmpeg"]
categories = ["multimedia::video", "development-tools"]

[package.metadata.lightflow]
runner = "lightflow-video-render-edit-runner"

[[bin]]
name = "lightflow-video-render-edit-runner"
path = "src/bin/runner.rs"

[dependencies]
lightflow = { workspace = true }
lightflow-auto-edit-runtime = { workspace = true }
