[package]
name = "lightflow-xry-batch-control"
version = "0.1.0"
edition = "2024"
description = "Restricted LightFlow control surface for canonical XRY batch operations."
license = "MIT OR Apache-2.0"

[package.metadata.lightflow]
runner = "lightflow-xry-batch-control-runner"

[[bin]]
name = "lightflow-xry-batch-control-runner"
path = "src/bin/runner.rs"

[dependencies]
lightflow = { workspace = true }
lightflow-xry-gateway = { path = "../../xry_gateway" }
