<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XRY 自动剪辑</title>
  <style>
    :root{color-scheme:dark;--bg:#10151d;--panel:#18212d;--line:#2d3b4d;--text:#e7eef7;--muted:#91a2b7;--accent:#52d6a2;--warn:#ffcc66;--bad:#ff7d87}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#20364b,var(--bg) 42%);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC",sans-serif}
    header{padding:26px 5vw 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:end}h1{margin:0;font-size:28px;letter-spacing:.02em}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.12em;text-transform:uppercase}.muted{color:var(--muted)}button{border:1px solid #426079;border-radius:8px;background:#233448;color:var(--text);padding:9px 14px;cursor:pointer}button:hover{border-color:var(--accent)}main{max-width:1500px;margin:auto;padding:22px 5vw 60px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:rgba(24,33,45,.93);border:1px solid var(--line);border-radius:12px;padding:16px}.metric{font-size:25px;font-weight:750;margin-top:3px}.label{color:var(--muted);font-size:12px}.panel{margin-top:14px}h2{font-size:17px;margin:0 0 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:12px;font-weight:600}.scroll{overflow:auto}.pill{display:inline-block;border-radius:999px;padding:2px 8px;background:#294157}.pass{color:var(--accent)}.fail{color:var(--bad)}.pending{color:var(--warn)}code{color:#c9daf2;white-space:pre-wrap;word-break:break-word}.check{display:flex;gap:8px;align-items:center;margin:5px 0}.check input{accent-color:var(--accent)}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:5px 12px}.kv b{color:var(--muted);font-weight:500}.actions{display:flex;gap:8px;align-items:center}.notice{color:var(--warn);margin:0 0 12px}@media(max-width:900px){.grid,.two{grid-template-columns:1fr 1fr}}@media(max-width:620px){header{display:block}.grid,.two{grid-template-columns:1fr}main{padding:16px 3vw}}
  </style>
</head>
<body>
<header><div><div class="eyebrow">LightFlow · XRY</div><h1>XRY 自动剪辑 · 实时进度</h1><div id="updated" class="muted">连接中…</div></div><div class="actions"><button id="refresh">刷新</button><button id="run">立即运行</button></div></header>
<main>
  <div class="grid"><div class="card"><div class="label">定时器</div><div id="timer" class="metric">—</div><div id="next" class="muted">—</div></div><div class="card"><div class="label">当前调度</div><div id="scheduler" class="metric">—</div><div id="lock" class="muted">—</div></div><div class="card"><div class="label">素材文件夹</div><div id="sourceCount" class="metric">—</div><div class="muted">可勾选调整</div></div><div class="card"><div class="label">成品账号目录</div><div id="outputCount" class="metric">—</div><div class="muted">真实路径：/srv/3.成品</div></div></div>
  <section class="panel"><h2>运行时、依赖与路径</h2><div id="runtime" class="kv"></div></section>
  <section class="panel"><h2>素材与任务选择</h2><p class="notice">空选择 = 扫描全部冻结任务；非标准目录会自动路由到“批量剪辑/未分类/”。</p><div class="two"><div><h3>素材文件夹</h3><div id="sources"></div></div><div><h3>任务</h3><div id="tasks"></div></div></div><button id="save">保存选择</button> <span id="saveStatus" class="muted"></span></section>
  <section class="panel"><h2>剪辑规则</h2><div id="rules"></div></section>
  <section class="panel"><h2>生产进度与质量门</h2><div class="scroll"><table><thead><tr><th>任务 / 主体</th><th>状态</th><th>质量门</th><th>回执</th><th>说明</th></tr></thead><tbody id="progress"></tbody></table></div></section>
  <section class="panel"><h2>输出</h2><div class="scroll"><table><thead><tr><th>账号目录</th><th>MP4 数量</th><th>实际路径</th></tr></thead><tbody id="outputs"></tbody></table></div></section>
</main>
<script>
let snapshot=null;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusClass=v=>/PASS|PACKAGED|active|enabled/i.test(v)?'pass':/REJECT|failed|inactive|disabled/i.test(v)?'fail':'pending';
async function refresh(){try{snapshot=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());render()}catch(e){$('updated').textContent='面板连接失败：'+e}}
function render(){const s=snapshot,t=s.timer||{},sch=s.scheduler||{};$('updated').textContent=`${s.host} · 更新于 ${s.updated_at}`;$('timer').innerHTML=`<span class="${statusClass(t.ActiveState)}">${esc(t.ActiveState||'unknown')}</span>`;$('next').textContent=`下一次：${t.NextElapseUSecRealtime||'未排程'} · ${t.OnCalendar||'—'}`;$('scheduler').innerHTML=`<span class="${statusClass(sch.ActiveState)}">${esc(sch.ActiveState||'idle')}</span>`;$('lock').textContent=`锁：${s.lock?'占用':'空闲'}`;$('sourceCount').textContent=s.sources.length;$('outputCount').textContent=s.outputs.length;
  const rows=[['主机',s.host],['编排入口','/srv/.lightflow/bin/lfw-xry'],['Video Work API','video-work-api.service :7860'],['媒体依赖','ffmpeg + ffprobe'],['ASR','FunClip / Paraformer'],['翻译','MADLAD-400-3B-MT'],['调度','systemd user timer'],...Object.entries(s.paths||{})];$('runtime').innerHTML=rows.map(([k,v])=>`<b>${esc(k)}</b><code>${esc(v)}</code>`).join('');
  $('sources').innerHTML=s.sources.map(x=>`<label class="check"><input type="checkbox" data-source="${esc(x.relative)}" ${s.config.enabled_sources.length===0||s.config.enabled_sources.includes(x.relative)?'checked':''}> <span>${esc(x.relative)} <span class="muted">(${x.videos} 视频 / ${x.photos} 图片)</span></span></label>`).join('')||'<span class="muted">未发现素材</span>';
  $('tasks').innerHTML=s.tasks.map(x=>`<label class="check"><input type="checkbox" data-task="${esc(x.task)}" ${s.config.enabled_tasks.length===0||s.config.enabled_tasks.includes(x.task)?'checked':''}> <span>${esc(x.task)} <span class="muted">(${x.subjects.length} 主体)</span></span></label>`).join('')||'<span class="muted">未发现预处理任务</span>';
  $('rules').innerHTML=(s.rules||[]).map(x=>`<div>• ${esc(x)}</div>`).join('');$('progress').innerHTML=s.tasks.flatMap(t=>t.subjects.map(x=>`<tr><td><code>${esc(t.task)}</code><br>${esc(x.subject)}</td><td>${esc(x.progress?.stage||x.progress?.status||'—')}</td><td class="${statusClass(x.status)}">${esc(x.status)}</td><td class="${statusClass(x.receipt)}">${esc(x.receipt||'—')}</td><td>${esc(x.reason||x.progress?.summary||'—')}</td></tr>`)).join('')||'<tr><td colspan="5" class="muted">暂无冻结主体</td></tr>';$('outputs').innerHTML=s.outputs.map(x=>`<tr><td>${esc(x.account)}</td><td>${x.videos}</td><td><code>${esc(x.path)}</code></td></tr>`).join('')||'<tr><td colspan="3" class="muted">暂无成品</td></tr>'}
$('refresh').onclick=refresh;$('run').onclick=async()=>{await fetch('/api/run',{method:'POST'});refresh()};$('save').onclick=async()=>{const enabled_tasks=[...document.querySelectorAll('[data-task]:checked')].map(x=>x.dataset.task),enabled_sources=[...document.querySelectorAll('[data-source]:checked')].map(x=>x.dataset.source);await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled_tasks,enabled_sources})});$('saveStatus').textContent='已保存';refresh()};refresh();setInterval(refresh,5000);
</script>
</body></html>
